version: '3.8'

services:
  # Flask Application with SQLite
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///app/database.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - .:/app
      - ./persistent_data:/app/persistent_data
      - ./data:/app/data
    command: >
      sh -c "
        echo 'Starting Flask application with SQLite...' &&
        python app.py
      "



